:root {
  --black: #0a0a0a;
  --white: #f5f5f5;
  --gray-900: #1a1a1a;
  --gray-800: #2a2a2a;
  --gray-700: #3a3a3a;
  --gray-600: #5a5a5a;
  --gray-500: #7a7a7a;
  --gray-300: #b0b0b0;
  --gray-100: #d0d0d0;
  --accent: #c0392b;
  --accent-hover: #e74c3c;
  --accent-dark: #962d22;
  --border-thick: 4px;
  --border-medium: 2px;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 32px;
  --space-xl: 48px;
  --space-2xl: 64px;
  --font-mono: 'Courier New', 'IBM Plex Mono', monospace;
  --font-sans: 'Noto Sans KR', 'Pretendard', -apple-system, sans-serif;
  --font-heading: 'Noto Sans KR', 'Pretendard', sans-serif;
  --max-width: 1200px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  background: var(--black);
}

body {
  font-family: var(--font-sans);
  background: var(--black);
  color: var(--white);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;

}

a {
  color: var(--white);

}

a:hover {
  color: var(--accent);
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

.container {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--space-lg);
}

/* ─── HAMBURGER MENU SYSTEM ─── */
.hamburger-menu {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  background: var(--black);
  border-bottom: var(--border-medium) solid var(--gray-800);
}

.hamburger-menu .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: var(--space-md);
  padding-bottom: var(--space-md);
}

.hamburger-menu .logo {
  font-family: var(--font-heading);
  font-size: 1.5rem;
  font-weight: 900;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  color: var(--white);
  line-height: 1;
}

.hamburger-menu .logo .accent {
  color: var(--accent);
}

.hamburger-menu .nav-toggle {
  display: none;
  background: none;
  border: var(--border-medium) solid var(--white);
  color: var(--white);
  font-size: 1.2rem;
  padding: var(--space-sm) var(--space-md);
  cursor: pointer;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  transition: all var(--transition);
}

.hamburger-menu .nav-toggle:hover {
  background: var(--white);
  color: var(--black);
}

.hamburger-menu .nav-list {
  display: flex;
  align-items: center;
  gap: var(--space-lg);
  list-style: none;
}

.hamburger-menu .nav-list li a {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--gray-300);
  transition: color var(--transition);
  position: relative;
  padding-bottom: var(--space-xs);
}

.hamburger-menu .nav-list li a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: var(--border-thick);
  background: var(--accent);
  transition: width var(--transition);
}

.hamburger-menu .nav-list li a:hover::after,
.hamburger-menu .nav-list li a.active::after {
  width: 100%;
}

.hamburger-menu .nav-list li a.active {
  color: var(--white);
}

.hamburger-menu .nav-list li a:hover {
  color: var(--white);
}

/* ─── RESPONSIVE 768 ─── */
@media (max-width: 768px) {
  .container {
    padding: 0 var(--space-md);
  }

  .hamburger-menu .nav-toggle {
    display: block;
  }

  .hamburger-menu .nav-list {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    flex-direction: column;
    background: var(--gray-900);
    border-bottom: var(--border-medium) solid var(--gray-700);
    padding: var(--space-md) 0;
    gap: 0;
  }

  .hamburger-menu .nav-list.open {
    display: flex;
  }

  .hamburger-menu .nav-list li {
    width: 100%;
  }

  .hamburger-menu .nav-list li a {
    display: block;
    padding: var(--space-md) var(--space-lg);
    border-bottom: 1px solid var(--gray-800);
    font-size: 1rem;
  }

  .hamburger-menu .nav-list li:last-child a {
    border-bottom: none;
  }

  .hamburger-menu .nav-list li a::after {
    display: none;
  }

  .hamburger-menu .logo {
    font-size: 1.2rem;
  }
}

  margin-bottom: var(--space-sm);
  font-weight: 700;
}

.section-title {
  font-family: var(--font-heading);
  font-size: clamp(1.6rem, 3vw, 2.4rem);
  font-weight: 800;

.section-title .accent {

}

.section-desc {

/* ─── GRID 2 ─── */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;

}

/* ─── GRID 3 ─── */
.grid-3 {

}

}

.card ul {

  padding: 0;
}

.card ul li {

}

.card ul li::before {

}

/* ─── DATA CARD ─── */
.data-card {
  background: var(--gray-900);
  border: var(--border-thick) solid var(--gray-800);

.data-card .data-value {

.data-card .data-label {

  text-transform: uppercase;

.data-card .data-desc {
  font-size: 0.85rem;
  color: var(--gray-400);

  border: var(--border-medium) solid var(--gray-800);

.data-table {

  font-size: 0.9rem;
}

.data-table thead {

.data-table th {

}

}

.info-list {

}

.info-list li {
  display: flex;
  gap: var(--space-md);
  padding: var(--space-md) 0;
  border-bottom: 1px solid var(--gray-800);
  align-items: flex-start;
}

.info-list li:last-child {
  border-bottom: none;
}

.info-list .info-label {

  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;

}

.info-list .info-content {

}

/* ─── FAQ ─── */
.faq-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
}

.faq-item {
  background: var(--gray-900);

}

.faq-item:hover {
  border-color: var(--gray-700);
}

.faq-question {
  display: flex;
  justify-content: space-between;

  padding: var(--space-lg);
  cursor: pointer;
  font-family: var(--font-heading);

  font-weight: 600;
  color: var(--white);
  background: none;
  border: none;
  width: 100%;

  transition: color var(--transition);
}

.faq-question:hover {
  color: var(--accent);
}

.faq-question .faq-toggle {
  font-size: 1.2rem;
  color: var(--accent);
  transition: transform var(--transition);
  flex-shrink: 0;
}

.faq-item.open .faq-toggle {
  transform: rotate(45deg);
}

.faq-answer {
  padding: 0 var(--space-lg) var(--space-lg);

  font-size: 0.9rem;
  line-height: 1.8;
  display: none;
}

.faq-item.open .faq-answer {
  display: block;
}
